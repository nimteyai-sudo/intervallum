[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intervallum-ml"
version = "0.1.0"
description = "Adaptive learning engine for Intervallum: FSRS memory, conjunctive IRT mastery, pedagogical task selection, and EGE readiness projection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Intervallum ML" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.8",
  "fsrs>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "httpx>=0.27", "hypothesis>=6.100", "pytest-cov>=5.0"]
fsrs-optimizer = ["torch>=2.3", "pandas>=2.2", "tqdm>=4.66"]

[project.scripts]
intervallum-demo = "intervallum_ml.cli:main"
intervallum-train = "scripts.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intervallum_ml", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
